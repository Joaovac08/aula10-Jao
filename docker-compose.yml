services:
  # Serviço 1: Banco de Dados
  db:
    image: postgres:15-alpine
    container_name: meu_postgres_jao
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senha_super_secreta
      POSTGRES_DB: banco_teste
    volumes:
      - pg_dados:/var/lib/postgresql/data
    networks:
      - app-network

  # Serviço 2: Aplicação Node.js
  app:
    build: .
    container_name: minha_api_node_jao
    restart: on-failure
    ports:
      - "8083:8080"
    environment:
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: senha_super_secreta
      DB_NAME: banco_teste
    depends_on:
      - db
    networks:
      - app-network

volumes:
  pg_dados:

networks:
  app-network:
    driver: bridge
